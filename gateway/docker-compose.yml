version: "3.9"

# Runs on the always-on PC at the clinic, on the same local network as the
# Xline XDI-350's acquisition PC. Nothing here is reachable from the internet -
# the sync agent is the only thing that calls out, over outbound HTTPS to
# shscan.com, matching the "gateway never exposed to the internet" design in
# section 2 of the development plan.
services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: shscan-gateway-orthanc
    restart: unless-stopped
    ports:
      - "4242:4242" # DICOM (the XDI-350 talks to this)
      - "8042:8042" # Orthanc's REST API (the sync agent talks to this, localhost only in practice)
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-db:/var/lib/orthanc/db

  sync-agent:
    build: ./sync-agent
    container_name: shscan-gateway-sync-agent
    restart: unless-stopped
    depends_on:
      - orthanc
    volumes:
      # Persists studyUploader.js's Orthanc /changes cursor across restarts -
      # without this, every redeploy replayed Orthanc's entire change
      # history from the beginning (which, after months of use, can take
      # far longer than the delay between a real scan and staff expecting
      # to see it on shscan.com) before it ever reached that day's new scans.
      - sync-agent-state:/app/state
    environment:
      ORTHANC_URL: "http://orthanc:8042"
      ORTHANC_USERNAME: "syncagent"
      ORTHANC_PASSWORD: "CHANGE_ME_STRONG_SECRET" # must match orthanc.json RegisteredUsers
      SHSCAN_API_URL: "https://shscan.com"
      GATEWAY_API_KEY: "CHANGE_ME_FROM_scripts/gateway_issue_key.js"
      SCHEDULED_STATION_AE_TITLE: "CHANGE_ME_MACHINE_AE_TITLE" # must match the machine's own AE Title (Application) field on its DICOM settings screen, not a made-up name
      WORKLIST_POLL_SECONDS: "30"
      STUDY_POLL_SECONDS: "15"
      # Once a study is safely uploaded to Drive, its local copy on this PC
      # is kept for this many hours (as a safety buffer) then auto-deleted
      # to free disk space. Raise this if staff want a longer local backup.
      STUDY_RETENTION_HOURS: "24"
      CLEANUP_POLL_SECONDS: "3600"
      # Only read on the first start after the sync-agent-state volume is
      # created (no saved cursor yet). Set it to Orthanc's current "Last"
      # change number (GET /changes?last) to skip replaying the whole history
      # on that start. Leave it empty to start from 0. Ignored once a cursor
      # has been saved.
      CHANGE_CURSOR_INITIAL: ""

volumes:
  orthanc-db:
  sync-agent-state:
